name: publish-social
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would publish, change nothing"
        type: boolean
        default: false
concurrency:
  group: publish-social
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          python publisher/publish.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
      - name: Commit state changes
        # Must run even when the publish step exits non-zero: a run can both
        # publish one post and fail another. Without this, the successful post's
        # move to published/ is lost and it gets published again next run, and
        # the failed post's attempts counter never persists (so MAX_ATTEMPTS
        # never trips). The job still reports failure via the publish step.
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "social-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue published
          git diff --cached --quiet || git commit -m "chore: publish run $(date -u +%FT%TZ)"
          git push
      - name: Alert on failure
        # Failures went unnoticed for 5 days in Oct 2026. Open one issue (emails the
        # owner); stay quiet while it is open so a 30-min cron doesn't spam.
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label publish-failure --state open --json number --jq length)
          [ "$open" -gt 0 ] && exit 0
          gh label create publish-failure --color B60205 --force
          errors=$(python -c "import json,glob;print('\n'.join(f\"- {d['id']}: attempts={d['attempts']} {d.get('last_error','')}\" for d in (json.load(open(f,encoding='utf-8')) for f in sorted(glob.glob('queue/*.json'))) if d['attempts']))")
          gh issue create --label publish-failure \
            --title "Social publishing is failing" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $errors

          Close this issue after fixing; the next failure will open a new one."
